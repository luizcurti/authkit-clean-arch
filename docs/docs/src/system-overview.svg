<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="canvas" width="1600" height="1840" viewBox="0 0 1600 1840" xmlns="http://www.w3.org/2000/svg">
        <!-- Inlined (not just the <head> copy above) so this still applies
             when the <svg> element is extracted standalone into
             system-overview.svg — an external stylesheet doesn't travel
             with it. -->
        <style>
            text {
                font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
            }
        </style>
        <rect x="0" y="0" width="1600" height="1840" fill="#ffffff" />
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
                orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#555" />
            </marker>
            <marker id="arrowDashRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#d6423a" />
            </marker>
        </defs>

        <!-- ============ ICON DEFINITIONS ============ -->
        <defs>
            <g id="icon-user">
                <circle cx="12" cy="8" r="4" stroke="white" stroke-width="1.8" fill="none" />
                <path d="M4,21 C4,15.5 8,13 12,13 C16,13 20,15.5 20,21" stroke="white" stroke-width="1.8" fill="none"
                    stroke-linecap="round" />
            </g>
            <g id="icon-shield">
                <path d="M12,3 L20,6.5 V11.5 C20,16.5 16.5,20 12,21.5 C7.5,20 4,16.5 4,11.5 V6.5 Z" stroke="white"
                    stroke-width="1.8" fill="none" stroke-linejoin="round" />
                <path d="M8.5,12 L11,14.5 L16,9" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </g>
            <g id="icon-server">
                <rect x="4" y="4" width="16" height="6" rx="1.4" stroke="white" stroke-width="1.7" fill="none" />
                <rect x="4" y="14" width="16" height="6" rx="1.4" stroke="white" stroke-width="1.7" fill="none" />
                <circle cx="7.3" cy="7" r="1" fill="white" />
                <circle cx="7.3" cy="17" r="1" fill="white" />
            </g>
            <g id="icon-db">
                <ellipse cx="12" cy="6" rx="7.5" ry="3" stroke="white" stroke-width="1.7" fill="none" />
                <path d="M4.5,6 V18 C4.5,19.7 7.9,21 12,21 C16.1,21 19.5,19.7 19.5,18 V6" stroke="white"
                    stroke-width="1.7" fill="none" />
                <path d="M4.5,12 C4.5,13.7 7.9,15 12,15 C16.1,15 19.5,13.7 19.5,12" stroke="white" stroke-width="1.7"
                    fill="none" />
            </g>
            <g id="icon-cloud">
                <path d="M7,17 a4,4 0 0 1 0,-8 a5,5 0 0 1 9.6,-1.3 A4.2,4.2 0 0 1 17,17 Z" stroke="white"
                    stroke-width="1.7" fill="none" stroke-linejoin="round" />
            </g>
            <g id="icon-cube">
                <path d="M12,3 L20,7.5 V16.5 L12,21 L4,16.5 V7.5 Z" stroke="white" stroke-width="1.7" fill="none"
                    stroke-linejoin="round" />
                <path d="M4,7.5 L12,12 L20,7.5 M12,12 V21" stroke="white" stroke-width="1.5" fill="none" />
            </g>
            <g id="icon-chart">
                <path d="M4,20 H20" stroke="white" stroke-width="1.7" stroke-linecap="round" />
                <rect x="6" y="13" width="3.2" height="7" rx="0.6" fill="white" />
                <rect x="10.4" y="8" width="3.2" height="12" rx="0.6" fill="white" />
                <rect x="14.8" y="4.5" width="3.2" height="15.5" rx="0.6" fill="white" />
            </g>
            <g id="icon-check">
                <circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.7" fill="none" />
                <path d="M7.5,12.3 L10.3,15 L16.5,8.8" stroke="white" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </g>
            <g id="icon-warn">
                <path d="M12,3.5 L21,19.5 H3 Z" stroke="white" stroke-width="1.7" fill="none" stroke-linejoin="round" />
                <path d="M12,10 V14.2" stroke="white" stroke-width="1.8" stroke-linecap="round" />
                <circle cx="12" cy="16.8" r="1" fill="white" />
            </g>
            <g id="icon-key">
                <circle cx="8" cy="15" r="4" stroke="white" stroke-width="1.8" fill="none" />
                <path d="M11,12 L20,3 M17,6 L19.5,8.5 M14.5,8.5 L16.5,10.5" stroke="white" stroke-width="1.8"
                    fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </defs>

        <!-- ============ MAIN SPINE ============ -->

        <!-- Client -->
        <rect x="635" y="94" width="376" height="103" rx="16" fill="#f1f1ef" stroke="#5a6b7a" stroke-width="1.5" />
        <rect x="663" y="115" width="60" height="60" rx="12" fill="#5a6b7a" />
        <use href="#icon-user" x="671" y="123" width="44" height="44" />
        <text x="745" y="153" font-size="24" font-weight="600" fill="#222">
            HTTP Client
        </text>

        <!-- main — composition root: Express bootstrap -->
        <rect x="564" y="329" width="517" height="132" rx="16" fill="#f4eefb" stroke="#7a3fbf" stroke-width="1.5" />
        <rect x="592" y="360" width="60" height="60" rx="12" fill="#7a3fbf" />
        <use href="#icon-shield" x="600" y="368" width="44" height="44" />
        <text x="674" y="385" font-size="24" font-weight="600" fill="#5a2f8f">
            main — Express bootstrap
        </text>
        <text x="674" y="410" font-size="16" fill="#7856c9">
            requestId, Prometheus metrics, helmet
        </text>
        <text x="674" y="432" font-size="16" fill="#7856c9">
            Rate limiting: 100/min global, 10/min login
        </text>
        <text x="674" y="450" font-size="13" fill="#7856c9">
            CORS allowlist · routes wired by factories
        </text>

        <!-- Error responses callout -->
        <rect x="1130" y="195" width="430" height="132" rx="12" fill="#fdeceb" stroke="#d6423a" stroke-width="1.3"
            stroke-dasharray="4,4" />
        <rect x="1150" y="213" width="34" height="34" rx="8" fill="#d6423a" />
        <use href="#icon-warn" x="1155" y="218" width="24" height="24" />
        <text x="1196" y="231" font-size="15" font-weight="600" fill="#a52a23">
            Non-2xx responses — { error, requestId }
        </text>
        <text x="1150" y="256" font-size="13" fill="#555">
            400 validation failed · 429 rate limit exceeded
        </text>
        <text x="1150" y="274" font-size="13" fill="#555">
            403 missing/invalid access token on a protected route
        </text>
        <text x="1150" y="292" font-size="13" fill="#555">
            401 invalid Facebook token or bad/expired/reused refresh
        </text>
        <text x="1150" y="310" font-size="13" fill="#555">
            502 Facebook down after retries · 500 server error
        </text>
        <path d="M1130,290 H1081 V520" stroke="#d6423a" stroke-width="1.4" stroke-dasharray="3,4" fill="none"
            marker-end="url(#arrowDashRed)" />

        <!-- application — controllers, validation, auth middleware -->
        <rect x="541" y="592" width="564" height="132" rx="16" fill="#eef2fb" stroke="#3a5bbf" stroke-width="1.5" />
        <rect x="569" y="628" width="60" height="60" rx="12" fill="#3a5bbf" />
        <use href="#icon-shield" x="577" y="636" width="44" height="44" />
        <text x="651" y="653" font-size="24" font-weight="600" fill="#28407f">
            application — Controllers
        </text>
        <text x="651" y="681" font-size="16" fill="#3a5bbf">
            Validate → call one use case → map to HTTP
        </text>
        <text x="651" y="703" font-size="13" fill="#3a5bbf">
            AuthenticationMiddleware verifies the Bearer JWT
        </text>

        <!-- spine arrows -->
        <line x1="823" y1="197" x2="823" y2="329" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />
        <line x1="823" y1="461" x2="823" y2="592" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />
        <line x1="823" y1="724" x2="823" y2="856" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />

        <!-- domain — pure use cases -->
        <rect x="541" y="856" width="564" height="132" rx="16" fill="#e8f4ea" stroke="#2f7a3f" stroke-width="1.5" />
        <rect x="569" y="892" width="60" height="60" rx="12" fill="#2f7a3f" />
        <use href="#icon-cube" x="577" y="900" width="44" height="44" />
        <text x="651" y="917" font-size="24" font-weight="600" fill="#1f5c2f">
            domain — Use Cases
        </text>
        <text x="651" y="940" font-size="16" fill="#2f7a3f">
            FacebookAuthentication · RefreshAccessToken
        </text>
        <text x="651" y="961" font-size="13" fill="#2f7a3f">
            ChangeProfilePicture · rotation includes reuse detection
        </text>
        <text x="651" y="979" font-size="13" fill="#2f7a3f">
            no express, typeorm, axios or aws-sdk imports
        </text>

        <!-- fan-out: repositories + gateways, one per infra concern -->
        <path d="M823,988 V1039 H330 V1120" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
        <path d="M823,988 V1039 H780 V1120" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
        <path d="M823,988 V1039 H1230 V1120" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />

        <!-- User & Profile Repositories -->
        <rect x="140" y="1120" width="380" height="132" rx="16" fill="#fbf1e6" stroke="#b5772a" stroke-width="1.5" />
        <rect x="164" y="1156" width="56" height="56" rx="12" fill="#b5772a" />
        <use href="#icon-server" x="171" y="1163" width="42" height="42" />
        <text x="238" y="1181" font-size="18" font-weight="600" fill="#8a5a1f">
            User &amp; Profile Repos
        </text>
        <text x="238" y="1207" font-size="13" fill="#a06626">
            PgUserAccountRepository
        </text>
        <text x="238" y="1226" font-size="13" fill="#a06626">
            PgUserProfileRepository
        </text>

        <!-- RefreshToken Repository -->
        <rect x="590" y="1120" width="380" height="132" rx="16" fill="#fbf1e6" stroke="#b5772a" stroke-width="1.5" />
        <rect x="614" y="1156" width="56" height="56" rx="12" fill="#b5772a" />
        <use href="#icon-server" x="621" y="1163" width="42" height="42" />
        <text x="688" y="1181" font-size="18" font-weight="600" fill="#8a5a1f">
            RefreshToken Repo
        </text>
        <text x="688" y="1207" font-size="13" fill="#a06626">
            token_hash unique · family_id
        </text>
        <text x="688" y="1226" font-size="13" fill="#a06626">
            reuse ⇒ revokes the whole family
        </text>

        <!-- External Gateways -->
        <rect x="1040" y="1120" width="380" height="132" rx="16" fill="#fbf1e6" stroke="#b5772a" stroke-width="1.5" />
        <rect x="1064" y="1156" width="56" height="56" rx="12" fill="#b5772a" />
        <use href="#icon-cloud" x="1071" y="1163" width="42" height="42" />
        <text x="1138" y="1181" font-size="18" font-weight="600" fill="#8a5a1f">
            External Gateways
        </text>
        <text x="1138" y="1207" font-size="13" fill="#a06626">
            FacebookApi — 5s timeout + retry
        </text>
        <text x="1138" y="1226" font-size="13" fill="#a06626">
            AwsS3FileStorage — profile pictures
        </text>

        <!-- PostgreSQL (fed by both repository boxes) -->
        <rect x="140" y="1294" width="830" height="110" rx="16" fill="#e6f7f5" stroke="#0e9488" stroke-width="1.5" />
        <rect x="164" y="1322" width="54" height="54" rx="12" fill="#0e9488" />
        <use href="#icon-db" x="171" y="1329" width="40" height="40" />
        <text x="236" y="1348" font-size="20" font-weight="600" fill="#0b6e64">
            PostgreSQL
        </text>
        <text x="236" y="1372" font-size="14" fill="#128a7d">users, refresh_tokens — schema owned by TypeORM migrations</text>

        <!-- External Services (fed by the gateways box) -->
        <rect x="1040" y="1294" width="380" height="110" rx="16" fill="#e6f7f5" stroke="#0e9488" stroke-width="1.5" />
        <rect x="1064" y="1322" width="54" height="54" rx="12" fill="#0e9488" />
        <use href="#icon-cloud" x="1071" y="1329" width="40" height="40" />
        <text x="1136" y="1348" font-size="19" font-weight="600" fill="#0b6e64">
            External Services
        </text>
        <text x="1136" y="1372" font-size="13" fill="#128a7d">Facebook Graph API · AWS S3</text>

        <line x1="330" y1="1252" x2="330" y2="1294" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />
        <path d="M780,1252 V1270 H555 V1294" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
        <line x1="1230" y1="1252" x2="1230" y2="1294" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />

        <!-- Response: both paths converge on one outcome -->
        <path d="M555,1404 V1484 H800" stroke="#555" stroke-width="1.8" fill="none" />
        <path d="M1230,1404 V1484 H800" stroke="#555" stroke-width="1.8" fill="none" />
        <path d="M800,1484 V1554" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />

        <rect x="588" y="1554" width="424" height="103" rx="20" fill="#e8f4ea" stroke="#2f7a3f" stroke-width="1.5" />
        <rect x="612" y="1580" width="52" height="52" rx="12" fill="#2f7a3f" />
        <use href="#icon-check" x="620" y="1588" width="36" height="36" />
        <text x="680" y="1606" font-size="20" font-weight="600" fill="#1f5c2f">
            Response returned
        </text>
        <text x="680" y="1628" font-size="14" fill="#2f7a3f">
            200 success · 400/401/403/404/429/500/502 on error
        </text>

        <!-- ============ LEFT: LEGEND ============ -->
        <rect x="40" y="329" width="470" height="222" rx="12" fill="#fffdf2" stroke="#cdbf7a" stroke-width="1.5"
            stroke-dasharray="5,4" />
        <text x="62" y="362" font-size="20" font-weight="600" fill="#8a7a2b">
            Legend — Clean Architecture layers
        </text>

        <rect x="62" y="380" width="30" height="30" rx="7" fill="#7a3fbf" />
        <use href="#icon-shield" x="67" y="385" width="20" height="20" />
        <text x="102" y="400" font-size="15" fill="#222">main</text>

        <rect x="62" y="422" width="30" height="30" rx="7" fill="#3a5bbf" />
        <use href="#icon-shield" x="67" y="427" width="20" height="20" />
        <text x="102" y="442" font-size="15" fill="#222">application</text>

        <rect x="62" y="464" width="30" height="30" rx="7" fill="#2f7a3f" />
        <use href="#icon-cube" x="67" y="469" width="20" height="20" />
        <text x="102" y="484" font-size="15" fill="#222">domain</text>

        <rect x="62" y="506" width="30" height="30" rx="7" fill="#b5772a" />
        <use href="#icon-server" x="67" y="511" width="20" height="20" />
        <text x="102" y="526" font-size="15" fill="#222">infra</text>

        <rect x="280" y="380" width="30" height="30" rx="7" fill="#0e9488" />
        <use href="#icon-db" x="285" y="385" width="20" height="20" />
        <text x="320" y="400" font-size="15" fill="#222">External (DB / API)</text>

        <rect x="280" y="422" width="30" height="30" rx="7" fill="#3a5bbf" />
        <use href="#icon-key" x="285" y="427" width="20" height="20" />
        <text x="320" y="442" font-size="15" fill="#222">Bearer JWT auth</text>

        <rect x="280" y="464" width="30" height="30" rx="7" fill="#d6423a" />
        <use href="#icon-warn" x="285" y="469" width="20" height="20" />
        <text x="320" y="484" font-size="15" fill="#222">Error outcome</text>

        <rect x="280" y="506" width="30" height="30" rx="7" fill="#2f7a3f" />
        <use href="#icon-check" x="285" y="511" width="20" height="20" />
        <text x="320" y="526" font-size="15" fill="#222">Success outcome</text>

        <!-- ============ RIGHT COLUMN: REQUEST / RESPONSE / OBSERVABILITY ============ -->

        <rect x="1130" y="329" width="430" height="220" rx="10" fill="#eef2fb" stroke="#3a5bbf" stroke-width="1.3"
            stroke-dasharray="4,4" />
        <text x="1150" y="356" font-size="16" font-weight="600" fill="#28407f">
            Example — Facebook login
        </text>
        <text x="1150" y="380" font-size="14" fill="#333">
            POST /api/login/facebook { token }
        </text>
        <text x="1150" y="404" font-size="14" fill="#333">
            200 { accessToken, refreshToken }
        </text>
        <text x="1150" y="424" font-size="12" fill="#28407f">
            access token: 15 min JWT (HS256)
        </text>
        <text x="1150" y="442" font-size="12" fill="#28407f">
            refresh token: opaque UUID, 7 days, rotated on every refresh
        </text>
        <text x="1150" y="460" font-size="12" fill="#28407f">
            POST /api/login/refresh rotates it; reusing a rotated token
        </text>
        <text x="1150" y="478" font-size="12" fill="#28407f">
            revokes the whole token family (see ADR-0010)
        </text>

        <rect x="1130" y="579" width="430" height="160" rx="10" fill="#e6f7f5" stroke="#0e9488" stroke-width="1.5"
            stroke-dasharray="5,4" />
        <text x="1150" y="608" font-size="18" font-weight="600" fill="#0b6e64">
            Observability
        </text>

        <rect x="1150" y="624" width="34" height="34" rx="8" fill="#0e9488" />
        <use href="#icon-chart" x="1155" y="629" width="24" height="24" />
        <text x="1196" y="642" font-size="15" fill="#222">
            GET /api/metrics — Prometheus
        </text>
        <text x="1196" y="662" font-size="13" fill="#555">
            Request duration histogram + counter, per route
        </text>

        <rect x="1150" y="686" width="34" height="34" rx="8" fill="#465a69" />
        <use href="#icon-server" x="1155" y="691" width="24" height="24" />
        <text x="1196" y="704" font-size="15" fill="#222">
            Structured JSON logs (Winston)
        </text>
        <text x="1196" y="722" font-size="13" fill="#555">
            X-Request-Id correlates every log line and error body to a request
        </text>

        <!-- Health & metrics endpoints — its own row, below the main spine -->
        <rect x="330" y="1694" width="940" height="110" rx="16" fill="#eef2fb" stroke="#3a5bbf" stroke-width="1.5" />
        <text x="350" y="1723" font-size="20" font-weight="600" fill="#28407f">
            Operational endpoints — under /api
        </text>

        <text x="350" y="1754" font-size="14" fill="#222">
            GET /api/health — basic status, uptime, memory
        </text>
        <text x="350" y="1776" font-size="14" fill="#222">
            GET /api/health/detailed — DB latency, memory, system info
        </text>
        <text x="820" y="1754" font-size="14" fill="#222">
            GET /api/metrics — Prometheus text format
        </text>
        <text x="820" y="1776" font-size="14" fill="#222">
            All three share the globalRateLimiter (100 req/min/IP)
        </text>

        <!-- footer -->
        <text x="40" y="1814" font-size="14" fill="#999">
            High-level view — the big pieces and how a request flows between them.
            See README.md and docs/ for detailed diagrams.
        </text>
    </svg>
